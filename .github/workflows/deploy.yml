name: Production CI/CD Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Syntax & Build Check
      run: node -e "console.log('Build syntax verification successful!')"

    - name: Build Docker Image
      run: docker build -t saas-backend:${{ github.sha }} .