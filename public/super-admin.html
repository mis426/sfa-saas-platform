<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Admin - Seat License Control</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
    .card { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; color: #38bdf8; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
    th { background-color: #334155; color: #94a3b8; }
    input[type="number"] { width: 70px; padding: 6px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; }
    .btn-update { padding: 6px 14px; background: #0284c7; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-update:hover { background: #0369a1; }
    .status-active { color: #4ade80; font-weight: bold; }
    .status-inactive { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>Central Super Admin Panel</h2>
  <p style="color: #94a3b8; font-size: 14px;">Manage client subscription seat limits in real-time.</p>

  <table>
    <thead>
      <tr>
        <th>Company Name</th>
        <th>Status</th>
        <th>Max Allowed Seats</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="clientsTable">
      <tr><td colspan="4">Loading client licenses...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // 1. Fetch all registered clients
  async function loadClients() {
    try {
      const res = await fetch('http://localhost:5000/api/admin/clients');
      const clients = await res.json();
      const tbody = document.getElementById('clientsTable');
      tbody.innerHTML = '';

      if (!clients || clients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">No clients registered.</td></tr>';
        return;
      }

      clients.forEach(client => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${client.companyName}</strong></td>
          <td>
            <span class="${client.status === 'active' ? 'status-active' : 'status-inactive'}">
              ${client.status.toUpperCase()}
            </span>
          </td>
          <td>
            <input type="number" id="limit-${client._id}" value="${client.maxAllowedUsers}" min="1">
          </td>
          <td>
            <button class="btn-update" onclick="updateLimit('${client._id}')">Update Seats</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    } catch (err) {
      alert("Clients load karne me error aaya: " + err.message);
    }
  }

  // 2. Update maxAllowedUsers limit for a client
  async function updateLimit(clientId) {
    const newLimit = document.getElementById(`limit-${clientId}`).value;
    
    if (!newLimit || newLimit < 1) {
      alert("Valid seat count enter karein.");
      return;
    }

    try {
      const res = await fetch(`http://localhost:5000/api/admin/clients/${clientId}/limit`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ maxAllowedUsers: parseInt(newLimit) })
      });

      const data = await res.json();
      if (res.status === 200) {
        alert('Seat limit successfully update ho gayi!');
        loadClients();
      } else {
        alert(data.error || 'Update failed');
      }
    } catch (err) {
      alert("Server update error: " + err.message);
    }
  }

  loadClients();
</script>

</body>
</html>
